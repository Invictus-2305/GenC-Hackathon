<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">▣</span>
        <span class="brand-name">Test Runner</span>
      </div>
      <div class="topbar-meta">
        <span id="project-path" class="project-path">—</span>
        <span class="conn-dot" id="conn-dot" title="connection status"></span>
      </div>
    </header>

    <div class="body">
      <aside class="sidebar">
        <div class="sidebar-head">
          <span>Tests</span>
          <button id="refresh-btn" class="icon-btn" title="Rescan project">⟲</button>
        </div>
        <div id="tree" class="tree">
          <div class="tree-empty">Scanning project…</div>
        </div>
      </aside>

      <main class="main">
        <div class="controls">
          <button id="run-selected-btn" class="btn btn-primary" disabled>Run selected</button>
          <button id="run-all-btn" class="btn">Run all tests</button>
          <div class="status-chip" id="status-chip">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Idle</span>
          </div>
          <div class="summary-chips" id="summary-chips"></div>
        </div>

        <div class="console-wrap">
          <div class="console-head">
            <span>Console</span>
            <button id="clear-btn" class="icon-btn" title="Clear console">✕</button>
          </div>
          <pre id="console" class="console"><span class="console-hint">Select tests on the left, then run.</span></pre>
        </div>

        <div class="observer-wrap" id="observer-wrap" hidden>
          <div class="observer-head">
            <span>AI Observer</span>
            <span id="observer-status-text" class="observer-status-text"></span>
          </div>
          <div id="observer-list" class="observer-list"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
